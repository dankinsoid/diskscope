name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the binary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i '' "s|version: \"[0-9.]*\"|version: \"$VERSION\"|" Sources/dscope/DScope.swift
          grep -n "version:" Sources/dscope/DScope.swift

      - name: Build for both architectures
        run: |
          swift build -c release --arch arm64 --arch x86_64
          BINARY=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/dscope
          echo "BINARY=$BINARY" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Check the binary runs
        run: |
          "$BINARY" --version
          "$BINARY" scan . --depth 1 --json > /tmp/scan.json
          python3 -c "import json;d=json.load(open('/tmp/scan.json'));assert d['totalBytes']>0,d"

      - name: Package
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="dscope-$VERSION"
          mkdir -p "$STAGE"
          cp "$BINARY" "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          cp -R skills "$STAGE/"
          tar -czf "dscope-$VERSION-macos.tar.gz" "$STAGE"

          SHA=$(shasum -a 256 "dscope-$VERSION-macos.tar.gz" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "archive=dscope-$VERSION-macos.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Update the Homebrew formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.package.outputs.sha256 }}"
          sed -i '' \
            -e "s|^  version .*|  version \"$VERSION\"|" \
            -e "s|^  sha256 .*|  sha256 \"$SHA\"|" \
            Formula/dscope.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dscope.rb
          git commit -m "Update the formula to $VERSION"
          git push origin HEAD:main

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.archive }}
          generate_release_notes: true
