name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Check the embedded skill matches its source
        run: |
          ./Scripts/embed-skill.sh
          git diff --exit-code Sources/dscope/Generated/SkillContents.swift \
            || { echo "Run Scripts/embed-skill.sh and commit the result"; exit 1; }

      - name: Check the CLI runs
        run: |
          BINARY=$(swift build -c release --show-bin-path)/dscope
          "$BINARY" --version
          "$BINARY" scan . --depth 1 --json > /tmp/scan.json
          python3 -c "import json;d=json.load(open('/tmp/scan.json'));assert d['totalBytes']>0,d"
